name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every tampering class the verifier claims to catch must fail, and the
  # clean fixture must pass. A vacuous verifier cannot go green here.
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Install integrity-pinned CLI
        run: scripts/install-pinned-cli.sh
      - name: Run adversarial suite
        run: test/run-adversarial.sh

  # The composite action itself, end to end: green on the clean fixture,
  # red on a tampered one.
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Stage candidates
        run: |
          cp -R test/fixtures/project ./candidate
          cp -R test/fixtures/project ./tampered
          sed -i 's/"minimumReleaseAgeHours": 72/"minimumReleaseAgeHours": 0/' tampered/safeinstall.config.json
      - name: Action passes the clean candidate
        uses: ./
        with:
          candidate-path: candidate
      - name: Action fails the tampered candidate
        id: tampered
        uses: ./
        with:
          candidate-path: tampered
        continue-on-error: true
      - name: Assert the tampered candidate failed
        run: |
          if [ "${{ steps.tampered.outcome }}" != "failure" ]; then
            echo "The action accepted a tampered candidate." >&2
            exit 1
          fi
